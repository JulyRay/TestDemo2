name: Factory Project CI
on:
  push:
    branches: ["factory/**"]
permissions:
  contents: read
jobs:
  factory-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: |
          git fsck --no-reflogs
      - run: |
          git diff --check
